name: Build Resume PDFs

on:
  push:
    paths:
      - 'resume_1page.html'
      - 'resume_2page.html'
      - 'generate_pdf.sh'
      - '.github/workflows/build-resume.yml'
  pull_request:
    paths:
      - 'resume_1page.html'
      - 'resume_2page.html'
      - 'generate_pdf.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate resume PDFs
        run: |
          chmod +x generate_pdf.sh
          ./generate_pdf.sh

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdfs
          path: |
            Jimmie_Maggard_Resume.pdf
            Jimmie_Maggard_Resume_2Page.pdf

      - name: Commit and push updated PDFs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Jimmie_Maggard_Resume.pdf Jimmie_Maggard_Resume_2Page.pdf
          if git diff --staged --quiet; then
            echo "No PDF changes detected."
          else
            git commit -m "Auto-generate updated resume PDFs [skip ci]"
            git push origin HEAD:main
          fi
